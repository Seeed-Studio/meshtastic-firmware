; Seeed Tracker T2000 - PlatformIO Build Configuration
;
; Hardware: nRF52840 + SX1262 + L76K GPS + LSM6DS IMU
; Features: LoRa mesh, GPS tracking, motion detection, solar charging

[env:seeed_tracker_t2000]
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
;  Meshtastic Metadata
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; TODO: Apply for official hardware model ID from Meshtastic project
; For development, use a temporary ID (check existing IDs to avoid conflicts)
custom_meshtastic_hw_model = 200
custom_meshtastic_hw_model_slug = SEEED_TRACKER_T2000
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed Tracker T2000
custom_meshtastic_images = seeed_tracker_t2000.svg
custom_meshtastic_tags = Seeed, GPS, Tracker, Solar

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
;  Board Configuration
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
board = seeed_tracker_t2000
extends = nrf52840_base

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
;  Build Flags
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/seeed_tracker_t2000
  -D SEEED_TRACKER_T2000
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
;  Source Files
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_tracker_t2000>

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
;  Linker Script
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
;  Debug Configuration
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
debug_tool = jlink

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
;  Library Dependencies (if needed)
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; lib_deps = ${nrf52840_base.lib_deps}
;   ; Add any additional libraries here
